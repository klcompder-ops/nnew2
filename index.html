<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aura-dev</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">
      <img src="assets/logo1.png" alt="aura-dev logo" style="width: 32px; height: 32px; object-fit: contain; margin-right: 8px;">
      aura-dev
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="upload.html">Upload</a>
      <span id="nav-user">Guest</span>
    </nav>
  </header>

  <div class="container">
    <div class="toolbar">
      <input id="search-input" placeholder="Cari kode...">
      <button id="filter-newest" class="active">Terbaru</button>
      <button id="filter-popular">Populer</button>
      <button id="filter-rated">Rating Tertinggi</button>
      <select id="filter-language">
        <option value="">Semua Bahasa</option>
        <option value="Luau">Luau</option>
        <option value="Lua">Lua</option>
      </select>
    </div>
    <div id="status" class="notice"></div>
    <div id="script-grid" class="grid"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
